# Gitleaks: reglas por defecto más exclusiones de rutas que no son código del
# proyecto (dependencias, artefactos de build y lockfiles). Sin esto el escaneo
# devuelve ruido de node_modules y .next y el hook acaba ignorándose.

[extend]
useDefault = true

[allowlist]
description = "Dependencias, artefactos generados y lockfiles"
paths = [
  # dependencias y entornos virtuales
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)vendor/''',
  # artefactos de build
  '''(^|/)\.next/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)out/''',
  '''(^|/)coverage/''',
  # lockfiles
  '''(^|/)package-lock\.json$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)yarn\.lock$''',
]
